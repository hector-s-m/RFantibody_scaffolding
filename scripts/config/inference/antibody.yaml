# Config for sampling symmetric assemblies.

defaults:
  - base

inference:
  model_runner: AbSampler

preprocess:
  msaprev_bugfix: True
  hotspot_dim: 23
  use_selfcond_emb: False

antibody:
  target_pdb: null
  framework_pdb: null
  T_scheme: single_T_correct_selfcond
  design_loops: ['H1:','H2:','H3:','L1:','L2:','L3:']
  correct_selfcond: True
  no_bugfix_t1d_mask: False
  terminate_bad_targeting: null
  hotspot_termination_threshold: 10
  hotspot_termination_failures_permitted: 20
  # Aromatic motif scaffolding
  motif_pdb: null              # Path to combined motif+target PDB (last chain = motif)
  motif_cdr_loop: 'H3'         # CDR loop to scaffold motif into (flanks auto-derived from design_loops)
